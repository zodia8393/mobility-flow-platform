name: mobility-flow

x-app-environment: &app-environment
  PYTHONUNBUFFERED: "1"
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_TOPIC: mobility.traffic-observation.v1
  KAFKA_DLQ_TOPIC: mobility.traffic-observation.dlq.v1
  KAFKA_CONSUMER_GROUP: mobility-traffic-bronze-writer-v1
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-mobility-lake}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mobility_minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mobility_minio_local}
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_local}@postgres:5432/mobility
  OPS_TOKEN: ${OPS_TOKEN:-local-ops-token}

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redpanda-init:
    condition: service_completed_successfully
  minio-init:
    condition: service_completed_successfully

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: mobility-flow-airflow:local
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_local}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-only-change-me}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    DBT_PROFILES_DIR: /opt/dbt-project
    DBT_LOG_PATH: /tmp/dbt-logs
    DBT_TARGET_PATH: /tmp/dbt-target
    DBT_DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_local}@postgres:5432/mobility
    SPARK_RUNNER_URL: http://spark-runner:8081
    CONTROL_API_URL: http://api:8000
    OPS_TOKEN: ${OPS_TOKEN:-local-ops-token}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/dbt-project:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility_local}
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mobility} -d mobility"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v24.3.18
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        rpk topic create mobility.traffic-observation.v1 --brokers redpanda:9092 --partitions 3 --replicas 1 || true;
        rpk topic create mobility.traffic-observation.dlq.v1 --brokers redpanda:9092 --partitions 1 --replicas 1 || true;
        rpk topic alter-config mobility.traffic-observation.v1 --set retention.ms=604800000 --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mobility_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mobility_minio_local}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-mobility_minio} ${MINIO_ROOT_PASSWORD:-mobility_minio_local}; do sleep 2; done;
        mc mb --ignore-existing local/${S3_BUCKET:-mobility-lake};
        mc anonymous set none local/${S3_BUCKET:-mobility-lake}
    depends_on:
      - minio

  producer:
    image: mobility-flow-app:local
    profiles: ["tools"]
    environment: *app-environment
    volumes:
      - ./examples:/app/examples:ro
    command: ["mobility-producer", "--count", "1000"]
    depends_on: *app-dependencies

  bronze-writer:
    image: mobility-flow-app:local
    environment:
      <<: *app-environment
      BRONZE_BATCH_SIZE: "500"
      BRONZE_FLUSH_SECONDS: "5"
      METRICS_PORT: "9101"
    command: ["mobility-bronze-writer"]
    ports:
      - "19101:9101"
    depends_on: *app-dependencies
    restart: unless-stopped

  spark-runner:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: mobility-flow-spark:local
    environment:
      <<: *app-environment
      SPARK_MASTER: local[2]
      SPARK_DRIVER_MEMORY: 1g
    ports:
      - "18081:8081"
      - "14040:4040"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobility-flow-app:local
    environment:
      <<: *app-environment
      APP_ENV: local
    command: ["uvicorn", "mobility_flow.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username ${AIRFLOW_ADMIN_USER:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname Traffic --lastname DataOps
        --role Admin --email admin@example.local || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "18080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      spark-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      spark-runner:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - bronze-writer
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "13000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redpanda-data:
  minio-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
