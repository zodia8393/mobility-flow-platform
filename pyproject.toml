[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mobility-flow"
version = "0.1.0"
description = "Operational pipeline for Seoul public real-time road traffic data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hyeongjun Cho" }]
dependencies = [
  "boto3>=1.35,<2",
  "confluent-kafka>=2.6,<3",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pyarrow>=18,<23",
  "pydantic-settings>=2.7,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.6"]
dev = [
  "playwright>=1.49,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
mobility-producer = "mobility_flow.producer:main"
mobility-bronze-writer = "mobility_flow.bronze_writer:main"
mobility-evidence = "mobility_flow.evidence:main"
mobility-failure-report = "mobility_flow.failure_report:main"
mobility-cloudwatch-publish = "mobility_flow.cloud_publish:main"
mobility-ingest-file = "mobility_flow.batch_ingest:main"
mobility-seoul-sync = "mobility_flow.seoul_citydata:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobility_flow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
