global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: mobility-control-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  - job_name: mobility-bronze-writer
    static_configs:
      - targets: ["bronze-writer:9101"]

  - job_name: mobility-spark-runner
    metrics_path: /metrics/
    static_configs:
      - targets: ["spark-runner:8081"]
