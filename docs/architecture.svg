<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">MobilityFlow Traffic DataOps architecture</title>
  <desc id="desc">Traffic file and Kafka ingestion, S3 lake, Airflow, Spark, dbt marts, delivery gates and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08142d"/><stop offset="1" stop-color="#102b54"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ca8ff"/></marker>
  </defs>
  <rect width="1400" height="620" rx="24" fill="url(#bg)"/>
  <text x="62" y="62" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">MobilityFlow DataOps</text>
  <text x="62" y="91" fill="#8fa9cb" font-family="Arial,sans-serif" font-size="14">Traffic file validation · replayable orchestration · delivery readiness</text>
  <g transform="translate(62 134)" filter="url(#shadow)">
    <rect width="190" height="116" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">01 · TRAFFIC SOURCE</text>
    <text x="20" y="61" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">TMAP·TCS·VDS·GPS</text>
    <text x="20" y="86" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">CSV/GZ/Parquet · 15m feed</text>
  </g>
  <path d="M262 192 H318" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(328 134)" filter="url(#shadow)">
    <rect width="190" height="116" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">02 · PREFLIGHT</text>
    <text x="20" y="61" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Mapping / Kafka</text>
    <text x="20" y="86" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">dry-run · SHA-256 · 3 partitions</text>
  </g>
  <path d="M528 192 H584" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(594 134)" filter="url(#shadow)">
    <rect width="216" height="116" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">03 · INGESTION</text>
    <text x="20" y="61" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Bronze / Quarantine</text>
    <text x="20" y="86" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">contract · reject reason · offset</text>
  </g>
  <path d="M820 192 H876" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(886 134)" filter="url(#shadow)">
    <rect width="190" height="116" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">04 · DATA LAKE</text>
    <text x="20" y="61" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">MinIO / AWS S3</text>
    <text x="20" y="86" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">partitioned Parquet</text>
  </g>
  <path d="M1086 192 H1142" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1152 134)" filter="url(#shadow)">
    <rect width="186" height="116" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#ffb65c" font-family="Arial,sans-serif" font-size="11" font-weight="700">INVALID PATH</text>
    <text x="20" y="61" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Dead Letter Queue</text>
    <text x="20" y="86" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">error + source offset</text>
  </g>
  <path d="M979 258 V324" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(846 334)" filter="url(#shadow)">
    <rect width="266" height="126" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">05 · PROCESSING</text>
    <text x="20" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Apache Spark</text>
    <text x="20" y="89" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">dedup · late data · speed index</text>
    <text x="20" y="108" fill="#6f89aa" font-family="Arial,sans-serif" font-size="11">object manifest + idempotent replay</text>
  </g>
  <path d="M836 397 H780" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(524 334)" filter="url(#shadow)">
    <rect width="246" height="126" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="20" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">06 · ANALYTICS</text>
    <text x="20" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">PostgreSQL + dbt</text>
    <text x="20" y="89" fill="#9db0cb" font-family="Arial,sans-serif" font-size="12">incremental fact · tests · marts</text>
    <text x="20" y="108" fill="#6f89aa" font-family="Arial,sans-serif" font-size="11">freshness warning 15m / error 30m</text>
  </g>
  <path d="M514 397 H458" stroke="#5ca8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(218 334)" filter="url(#shadow)">
    <rect width="230" height="126" rx="14" fill="url(#accent)"/>
    <text x="20" y="32" fill="#d8f5ff" font-family="Arial,sans-serif" font-size="11" font-weight="700">07 · DATA PRODUCT</text>
    <text x="20" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Control Room</text>
    <text x="20" y="89" fill="#dbeafe" font-family="Arial,sans-serif" font-size="12">READY/BLOCKED · SLO · evidence</text>
  </g>
  <g transform="translate(62 334)" filter="url(#shadow)">
    <rect width="128" height="126" rx="14" fill="#172c50" stroke="#36577f"/>
    <text x="16" y="32" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">ORCHESTRATE</text>
    <text x="16" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Airflow</text>
    <text x="16" y="89" fill="#9db0cb" font-family="Arial,sans-serif" font-size="11">retry · backfill</text>
    <text x="16" y="107" fill="#9db0cb" font-family="Arial,sans-serif" font-size="11">timeout · logs</text>
  </g>
  <path d="M126 324 V282 H647 V324" fill="none" stroke="#f3a94d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <g transform="translate(218 506)">
    <rect width="894" height="64" rx="12" fill="#0b1934" stroke="#29466e"/>
    <text x="24" y="26" fill="#72d5f6" font-family="Arial,sans-serif" font-size="11" font-weight="700">OBSERVABILITY &amp; CLOUD OPERATIONS</text>
    <text x="24" y="47" fill="#b5c5dd" font-family="Arial,sans-serif" font-size="13">Prometheus · Grafana · CloudWatch · Terraform · GitHub Actions</text>
  </g>
</svg>
