mobility_flow:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'mobility') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'mobility_local') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'mobility') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
