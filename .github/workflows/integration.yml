name: end-to-end-demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: cp .env.example .env
      - run: EVENT_COUNT=3000 make demo
      - uses: actions/upload-artifact@v4
        with:
          name: mobility-flow-run-evidence
          path: docs/evidence/generated/run_evidence.json
          if-no-files-found: error
